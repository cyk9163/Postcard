<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫邮 · 素材审核台</title>
<style>body{margin:0;background:#f6f3eb;color:#24483b;font:16px/1.7 system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{margin-bottom:8px}p{margin:8px 0}input,select,textarea,button{font:inherit;border:1px solid #bac7b8;border-radius:8px;padding:10px;background:#fffdf7;color:inherit;box-sizing:border-box}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bd7045}label{display:grid;gap:5px}header{padding:20px;background:#e8eee2;border-radius:14px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{border:1px solid #ccd3c6;padding:14px;background:#fffdf8;border-radius:12px;min-width:0}article img{width:100%;aspect-ratio:1400/770;object-fit:contain;background:#f0eee6}article h2{font-size:18px;margin:8px 0}article label{margin:10px 0}article textarea{width:100%}.muted{font-size:13px;color:#53634f;overflow-wrap:anywhere}nav{display:flex;align-items:center;gap:12px;margin:24px 0}.status{font-weight:bold}#message{min-height:28px}@media(max-width:750px){.cards{grid-template-columns:1fr}main{padding:16px}.filters>*{max-width:100%}}</style>
<main><header><h1>素材审核台</h1><p>构图检查不等于最终通过。核对地标、人物前景、主题差异和素材许可后，再填写审核结果。</p><p>本页只在本地制作环境使用，不会修改线上内容或生成图片。修改后请导出审核记录，刷新会丢失尚未导出的修改。</p><label>审核人<input id="reviewer" maxlength="80" placeholder="填写姓名或团队昵称"></label><button id="export">导出审核记录</button><p id="message" role="status"></p></header>
<div class="filters"><input id="search" aria-label="搜索城市或地点" placeholder="搜索城市或地点"><select id="status" aria-label="审核状态"><option value="all">全部状态</option><option value="pending">待审核</option><option value="needs-adjustment">需调整</option><option value="approved">已通过</option></select><select id="composition" aria-label="构图筛选"><option value="all">全部构图</option><option value="reviewed">有逐图构图规则</option><option value="pending">尚无逐图审核</option><option value="scenery">人物限定为风景</option></select></div>
<p id="count"></p><section class="cards" id="cards"></section><nav><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav></main>
<script>
const catalog=/*CATALOG*/;const changed=new Map(),drafts=new Map();let page=0;const size=18,$=id=>document.getElementById(id);
const labels={'pending':'待审核','needs-adjustment':'需调整','approved':'已通过'};
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('status').value,c=$('composition').value;return catalog.cards.filter(x=>(x.city+x.place+x.id).toLowerCase().includes(q)&&(s==='all'||x.review.status===s)&&(c==='all'||c==='reviewed'&&x.composition.reviewed||c==='pending'&&!x.composition.reviewed||c==='scenery'&&!x.composition.human));}
function render(){const rows=filtered();page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));$('count').textContent=`共 ${catalog.cards.length} 张；当前筛选 ${rows.length} 张；本次已记下 ${changed.size} 张。`;$('cards').replaceChildren();
 for(const c of rows.slice(page*size,(page+1)*size)){
  const a=document.createElement('article'),img=document.createElement('img');img.src=c.image;img.alt=c.place+' '+c.category;img.loading='lazy';a.append(img,element('h2',c.city+' · '+c.place),element('p',c.category+' / '+labels[c.review.status],'status'));
  a.append(element('p',c.composition.reviewed?'已有逐图构图规则；仍需最终美术审核':'构图待逐张检查','muted'),element('p',c.composition.human?'人物位置：'+c.composition.anchors.map(x=>({left:'左侧',center:'中间',right:'右侧'}[x.tag])).join(' / '):c.composition.note||'当前不支持人物合影','muted'));
  const credit=document.createElement('details');credit.append(element('summary','查看素材署名和图片指纹'),element('p',c.credit,'muted'),element('p',c.sha256,'muted'));a.append(credit);
  const status=document.createElement('select');status.setAttribute('aria-label',c.id+' 审核状态');for(const key in labels){const o=element('option',labels[key]);o.value=key;status.append(o);}status.value=drafts.get(c.id)?.status??c.review.status;
  const note=document.createElement('textarea');note.rows=3;note.maxLength=1500;note.value=drafts.get(c.id)?.note??c.review.note;note.placeholder='例如：建筑细节需核实，或已完成哪些检查';note.setAttribute('aria-label',c.id+' 审核备注');
  status.onchange=note.oninput=()=>{drafts.set(c.id,{status:status.value,note:note.value});$('message').textContent='这张还没记下；切换筛选会保留输入，导出前请点“记下这一张”。';};
  const save=element('button','记下这一张');save.onclick=()=>{const reviewer=$('reviewer').value.trim();if(status.value!=='pending'&&(!reviewer||!note.value.trim())){$('message').textContent='请填写审核人和具体备注，再标记通过或需调整。';return;}c.review={status:status.value,reviewer,note:note.value.trim(),at:new Date().toISOString()};drafts.delete(c.id);changed.set(c.id,{id:c.id,sha256:c.sha256,...c.review});$('message').textContent='已暂存本页修改；请导出记录后交给项目维护者导入。';render();};
  a.append(status,note,save);$('cards').append(a);
 }
 $('page').textContent=`${rows.length?page+1:0} / ${Math.ceil(rows.length/size)} 页`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=rows.length;
}
for(const id of ['search','status','composition'])$(id).addEventListener('input',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('export').onclick=()=>{if(drafts.size){$('message').textContent='还有 '+drafts.size+' 张输入尚未记下，请先逐张记下再导出。';return;}if(!changed.size){$('message').textContent='还没有记下新的审核结果。';return;}const blob=new Blob([JSON.stringify({format:'manyou-asset-reviews',version:1,reviews:[...changed.values()]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='manyou-asset-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('message').textContent='已准备审核文件，请确认保存成功。关闭前仍可再次导出。';};
window.addEventListener('beforeunload',e=>{if(changed.size||drafts.size){e.preventDefault();e.returnValue='';}});render();
</script></html>
